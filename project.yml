name: Refrain
options:
  bundleIdPrefix: dev.nikiomori
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  # XcodeGen doesn't know Icon Composer files yet; tell Xcode to compile it with actool.
  postGenCommand: sed -i '' 's/lastKnownFileType = wrapper.icon/lastKnownFileType = folder.iconcomposer.icon/' Refrain.xcodeproj/project.pbxproj
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  Refrain:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  Refrain:
    type: application
    platform: macOS
    sources:
      - path: Refrain
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - package: Refrain
        product: RefrainKit
      - package: Refrain
        product: RefrainServer
    info:
      path: Refrain/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSUIElement: true
        NSHumanReadableCopyright: MIT License
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.nikiomori.refrain
        PRODUCT_NAME: Refrain
